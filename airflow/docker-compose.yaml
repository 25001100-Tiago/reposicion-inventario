# Airflow 3 con LocalExecutor. Requiere airflow/.env (ver .env.example o `make airflow-env`).
x-airflow-comun: &airflow-comun
  image: apache/airflow:3.3.2-python3.12
  user: "${AIRFLOW_UID:?}:0"
  environment: &airflow-entorno
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/inventario/proyecto/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?}@postgres/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?}
    PYTHONPATH: /opt/inventario/proyecto/src
  volumes:
    - ..:/opt/inventario/proyecto
    - ../data/bandeja:/opt/inventario/proyecto/data/bandeja:ro
    - ./logs:/opt/airflow/logs
  depends_on: &airflow-depende
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: airflow
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-comun
    command: ["db", "migrate"]

  airflow-apiserver:
    <<: *airflow-comun
    command: ["api-server"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 18
    restart: unless-stopped
    depends_on:
      <<: *airflow-depende
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-comun
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 25s
      retries: 6
    restart: unless-stopped
    depends_on:
      <<: *airflow-depende
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-comun
    command: ["dag-processor"]
    restart: unless-stopped
    depends_on:
      <<: *airflow-depende
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-datos:
